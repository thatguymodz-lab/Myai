private fun downloadModel() {

    status.text = "CONNECTING TO MODEL SERVER…"

    lifecycleScope.launch(Dispatchers.IO) {

        var connection: HttpURLConnection? = null

        try {

            modelFile.parentFile?.mkdirs()

            val temporary =
                File(
                    modelFile.parentFile,
                    "jarvis.tmp"
                )

            // Remove an old incomplete download.
            if (temporary.exists()) {
                temporary.delete()
            }

            var currentUrl = URL(modelUrl)
            var redirects = 0

            // Follow redirects ourselves so Hugging Face downloads
            // work reliably and we can report HTTP errors properly.
            while (true) {

                connection =
                    currentUrl.openConnection()
                        as HttpURLConnection

                connection!!.instanceFollowRedirects = false
                connection!!.connectTimeout = 30000
                connection!!.readTimeout = 120000
                connection!!.requestMethod = "GET"

                connection!!.setRequestProperty(
                    "User-Agent",
                    "Jarvis-Android/2.0"
                )

                connection!!.setRequestProperty(
                    "Accept",
                    "application/octet-stream"
                )

                connection!!.connect()

                val response =
                    connection!!.responseCode

                if (
                    response == HttpURLConnection.HTTP_MOVED_PERM ||
                    response == HttpURLConnection.HTTP_MOVED_TEMP ||
                    response == HttpURLConnection.HTTP_SEE_OTHER ||
                    response == 307 ||
                    response == 308
                ) {

                    val location =
                        connection!!
                            .getHeaderField("Location")
                            ?: throw Exception(
                                "Model server redirected without a destination."
                            )

                    connection!!.disconnect()
                    connection = null

                    currentUrl =
                        URL(
                            currentUrl,
                            location
                        )

                    redirects++

                    if (redirects > 10) {
                        throw Exception(
                            "Too many model download redirects."
                        )
                    }

                    continue
                }

                if (response !in 200..299) {

                    val errorText =
                        try {
                            connection!!
                                .errorStream
                                ?.bufferedReader()
                                ?.use {
                                    it.readText()
                                        .take(300)
                                }
                        } catch (_: Exception) {
                            null
                        }

                    throw Exception(
                        "HTTP $response" +
                            if (!errorText.isNullOrBlank()) {
                                " - $errorText"
                            } else {
                                ""
                            }
                    )
                }

                break
            }

            val totalBytes =
                connection!!.contentLengthLong

            runOnUiThread {

                status.text =
                    if (totalBytes > 0) {

                        "DOWNLOADING MODEL • 0% • 0 / " +
                            (totalBytes / 1024 / 1024) +
                            " MB"

                    } else {

                        "DOWNLOADING MODEL • 0 MB"
                    }
            }

            connection!!
                .inputStream
                .buffered()
                .use { source ->

                    temporary
                        .outputStream()
                        .buffered()
                        .use { destination ->

                            val buffer =
                                ByteArray(
                                    256 * 1024
                                )

                            var downloaded =
                                0L

                            var lastPercent =
                                -1

                            while (true) {

                                val count =
                                    source.read(
                                        buffer
                                    )

                                if (count == -1) {
                                    break
                                }

                                destination.write(
                                    buffer,
                                    0,
                                    count
                                )

                                downloaded += count

                                val percent =
                                    if (totalBytes > 0) {

                                        (
                                            downloaded *
                                                100 /
                                                totalBytes
                                            )
                                            .toInt()
                                            .coerceIn(
                                                0,
                                                100
                                            )

                                    } else {
                                        -1
                                    }

                                if (
                                    percent !=
                                    lastPercent
                                ) {

                                    lastPercent =
                                        percent

                                    val downloadedMb =
                                        downloaded /
                                            1024 /
                                            1024

                                    val totalMb =
                                        if (
                                            totalBytes > 0
                                        ) {

                                            totalBytes /
                                                1024 /
                                                1024

                                        } else {
                                            0
                                        }

                                    runOnUiThread {

                                        status.text =
                                            if (
                                                percent >= 0
                                            ) {

                                                "DOWNLOADING • " +
                                                    percent +
                                                    "% • " +
                                                    downloadedMb +
                                                    " / " +
                                                    totalMb +
                                                    " MB"

                                            } else {

                                                "DOWNLOADING • " +
                                                    downloadedMb +
                                                    " MB"
                                            }
                                    }
                                }
                            }

                            destination.flush()
                        }
                }

            connection!!.disconnect()
            connection = null

            val downloadedSize =
                temporary.length()

            // The Qwen model is hundreds of MB.
            // Anything below 50 MB is definitely incomplete.
            if (
                downloadedSize <
                50L * 1024 * 1024
            ) {

                temporary.delete()

                throw Exception(
                    "Downloaded file is incomplete (" +
                        downloadedSize /
                        1024 /
                        1024 +
                        " MB)."
                )
            }

            // Basic GGUF file verification.
            val header =
                ByteArray(4)

            temporary
                .inputStream()
                .use { stream ->

                    if (
                        stream.read(header) != 4
                    ) {

                        throw Exception(
                            "Could not verify downloaded model."
                        )
                    }
                }

            val gguf =
                header[0].toInt()
                    .toChar() == 'G' &&
                header[1].toInt()
                    .toChar() == 'G' &&
                header[2].toInt()
                    .toChar() == 'U' &&
                header[3].toInt()
                    .toChar() == 'F'

            if (!gguf) {

                temporary.delete()

                throw Exception(
                    "Downloaded file is not a valid GGUF model."
                )
            }

            if (modelFile.exists()) {
                modelFile.delete()
            }

            if (
                !temporary.renameTo(
                    modelFile
                )
            ) {

                // Some Android filesystems can fail renameTo,
                // so fall back to copying it.
                temporary.copyTo(
                    modelFile,
                    overwrite = true
                )

                temporary.delete()
            }

            if (!modelFile.exists()) {

                throw Exception(
                    "Model could not be saved on the phone."
                )
            }

            val finalMb =
                modelFile.length() /
                    1024 /
                    1024

            runOnUiThread {

                status.text =
                    "MODEL DOWNLOADED • " +
                        finalMb +
                        " MB"

                addMessage(
                    "JARVIS",
                    "Local AI model downloaded and verified successfully. Loading it now."
                )

                loadModel()
            }

        } catch (
            error: Exception
        ) {

            try {
                connection?.disconnect()
            } catch (_: Exception) {
            }

            runOnUiThread {

                status.text =
                    "MODEL DOWNLOAD FAILED"

                addMessage(
                    "JARVIS",
                    "Model download failed: " +
                        (
                            error.message
                                ?: error
                                    .javaClass
                                    .simpleName
                            ) +
                        ". Tap MODEL to retry."
                )
            }
        }
    }
}
