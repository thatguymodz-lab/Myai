                      primary = cyan,
                      background = background,
                      surface = Color(0xFF071522)
                  )
              ) {

                  Column(
                      Modifier
                          .fillMaxSize()
                          .background(background)
                          .padding(16.dp)
                  ) {

                      Text(
                          "JARVIS // ANDROID LITE",
                          color = cyan,
                          style =
                              MaterialTheme.typography.headlineSmall
                      )

                      Text(
                          "FAST • TALK • LOCAL-FIRST",
                          color = Color.LightGray
                      )

                      Spacer(
                          Modifier.height(12.dp)
                      )

                      LazyColumn(
                          Modifier
                              .weight(1f)
                              .fillMaxWidth()
                      ) {

                          items(messages) { message ->

                              Text(
                                  "${message.who}: ${message.text}",
                                  color =
                                      if (message.who == "YOU")
                                          Color.White
                                      else
                                          cyan,
                                  modifier =
                                      Modifier.padding(
                                          vertical = 7.dp
                                      )
                              )
                          }
                      }

                      Row(
                          Modifier.fillMaxWidth()
                      ) {

                          OutlinedTextField(
                              value = input,
                              onValueChange = {
                                  input = it
                              },
                              modifier =
                                  Modifier.weight(1f),
                              label = {
                                  Text("Talk to Jarvis")
                              }
                          )

                          Spacer(
                              Modifier.width(8.dp)
                          )

                          Button(
                              onClick = {

                                  val question =
                                      input.trim()

                                  if (question.isNotEmpty()) {

                                      messages +=
                                          Msg(
                                              "YOU",
                                              question
                                          )

                                      messages +=
                                          Msg(
                                              "JARVIS",
                                              "I received that. Offline AI model support
