name: Build Jarvis Android V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Working Jarvis V2
        shell: bash
        run: |
          set -e

          echo "Restoring the last confirmed working Jarvis V2 source..."

          git show ad4e9d78633532454058da7cc851b3fe5c489e2b:.github/workflows/main.yml > /tmp/working-main.yml

          awk '
          /^      - name: Generate Jarvis V2$/ {
              found=1
              next
          }

          found && /^        run: \|$/ {
              capture=1
              next
          }

          capture && /^      - name: Build Jarvis V2 APK$/ {
              exit
          }

          capture {
              sub(/^          /, "")
              print
          }
          ' /tmp/working-main.yml > /tmp/generate-jarvis.sh

          chmod +x /tmp/generate-jarvis.sh

          echo "Generating Jarvis Android project..."

          /tmp/generate-jarvis.sh

          echo "Jarvis V2 source restored."

      - name: Improve Model Download URL
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/novajarvis/android/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "MainActivity.kt was not generated."
            exit 1
          fi

          python3 -c '
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/novajarvis/android/MainActivity.kt"
          )

          text = path.read_text()

          old = (
              "https://huggingface.co/"
              "Qwen/Qwen2.5-0.5B-Instruct-GGUF/"
              "resolve/main/"
              "qwen2.5-0.5b-instruct-q4_k_m.gguf"
              "?download=true"
          )

          new = (
              "https://huggingface.co/"
              "Qwen/Qwen2.5-0.5B-Instruct-GGUF/"
              "resolve/main/"
              "qwen2.5-0.5b-instruct-q4_k_m.gguf"
          )

          if old in text:
              text = text.replace(old, new)
              print("Model URL updated.")
          else:
              print("Model URL already updated or not found.")

          path.write_text(text)
          '

      - name: Check Jarvis Files
        shell: bash
        run: |
          set -e

          echo "Checking generated Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/novajarvis/android/MainActivity.kt

          echo "All Jarvis files are present."

      - name: Build Jarvis V2 APK
        shell: bash
        run: |
          set -e

          echo "Building Jarvis..."

          gradle --no-daemon :app:assembleDebug

      - name: Verify Jarvis V2 APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Jarvis APK was not created."
            exit 1
          fi

          echo "Jarvis V2 APK created successfully."
          ls -lh "$APK"

      - name: Upload Jarvis V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
