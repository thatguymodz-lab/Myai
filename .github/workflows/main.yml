name: Build Jarvis Android V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore working Jarvis V2 source
        shell: bash
        run: |
          git show ad4e9d78633532454058da7cc851b3fe5c489e2b:.github/workflows/main.yml > /tmp/jarvis-working.yml

          python3 <<'PY'
          from pathlib import Path

          text = Path("/tmp/jarvis-working.yml").read_text()

          marker1 = "      - name: Generate Jarvis V2\n"
          marker2 = "      - name: Build Jarvis V2 APK\n"

          start = text.index(marker1)
          start = text.index("        run: |\n", start) + len("        run: |\n")
          end = text.index(marker2, start)

          block = text[start:end]

          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)

          script = "\n".join(lines)

          Path("/tmp/generate_jarvis.sh").write_text(
              "#!/usr/bin/env bash\nset -e\n" + script + "\n"
          )
          PY

          chmod +x /tmp/generate_jarvis.sh
          /tmp/generate_jarvis.sh

      - name: Upgrade model downloader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/novajarvis/android/MainActivity.kt"
          )

          s = p.read_text()

          start_marker = "              private fun downloadModel() {"
          end_marker = "              private fun startVoice() {"

          start = s.index(start_marker)
          end = s.index(end_marker, start)

          new_function = r'''              private fun downloadModel() {

                  status.text =
                      "CONNECTING TO MODEL SERVER…"

                  lifecycleScope.launch(
                      Dispatchers.IO
                  ) {

                      var connection:
                          HttpURLConnection? =
                          null

                      try {

                          modelFile
                              .parentFile
                              ?.mkdirs()

                          val temporary =
                              File(
                                  modelFile.parentFile,
                                  "jarvis.tmp"
                              )

                          if (
                              temporary.exists()
                          ) {
                              temporary.delete()
                          }

                          var currentUrl =
                              URL(modelUrl)

                          var redirects =
                              0

                          while (true) {

                              connection =
                                  currentUrl
                                      .openConnection()
                                      as HttpURLConnection

                              connection!!
                                  .instanceFollowRedirects =
                                  false

                              connection!!
                                  .connectTimeout =
                                  30000

                              connection!!
                                  .readTimeout =
                                  120000

                              connection!!
                                  .requestMethod =
                                  "GET"

                              connection!!
                                  .setRequestProperty(
                                      "User-Agent",
                                      "Jarvis-Android/2.0"
                                  )

                              connection!!
                                  .setRequestProperty(
                                      "Accept",
                                      "application/octet-stream"
                                  )

                              connection!!
                                  .connect()

                              val response =
                                  connection!!
                                      .responseCode

                              if (
                                  response ==
                                  HttpURLConnection.HTTP_MOVED_PERM ||
                                  response ==
                                  HttpURLConnection.HTTP_MOVED_TEMP ||
                                  response ==
                                  HttpURLConnection.HTTP_SEE_OTHER ||
                                  response == 307 ||
                                  response == 308
                              ) {

                                  val location =
                                      connection!!
                                          .getHeaderField(
                                              "Location"
                                          )
                                          ?: throw Exception(
                                              "Model server redirected without a destination."
                                          )

                                  connection!!
                                      .disconnect()

                                  connection =
                                      null

                                  currentUrl =
                                      URL(
                                          currentUrl,
                                          location
                                      )

                                  redirects++

                                  if (
                                      redirects > 10
                                  ) {

                                      throw Exception(
                                          "Too many model download redirects."
                                      )
                                  }

                                  continue
                              }

                              if (
                                  response !in
                                  200..299
                              ) {

                                  val errorText =
                                      try {

                                          connection!!
                                              .errorStream
                                              ?.bufferedReader()
                                              ?.use {
                                                  it
                                                      .readText()
                                                      .take(
                                                          300
                                                      )
                                              }

                                      } catch (
                                          ignored: Exception
                                      ) {
                                          null
                                      }

                                  throw Exception(
                                      "HTTP " +
                                          response +
                                          if (
                                              !errorText
                                                  .isNullOrBlank()
                                          ) {
                                              " - " +
                                                  errorText
                                          } else {
                                              ""
                                          }
                                  )
                              }

                              break
                          }

                          val totalBytes =
                              connection!!
                                  .contentLengthLong

                          runOnUiThread {

                              status.text =
                                  if (
                                      totalBytes > 0
                                  ) {

                                      "DOWNLOADING • 0% • 0 / " +
                                          (
                                              totalBytes /
                                              1024 /
                                              1024
                                          ) +
                                          " MB"

                                  } else {

                                      "DOWNLOADING MODEL • 0 MB"
                                  }
                          }

                          connection!!
                              .inputStream
                              .buffered()
                              .use { source ->

                                  temporary
                                      .outputStream()
                                      .buffered()
                                      .use {
                                          destination ->

                                          val buffer =
                                              ByteArray(
                                                  256 *
                                                  1024
                                              )

                                          var downloaded =
                                              0L

                                          var lastPercent =
                                              -1

                                          while (
                                              true
                                          ) {

                                              val count =
                                                  source
                                                      .read(
                                                          buffer
                                                      )

                                              if (
                                                  count ==
                                                  -1
                                              ) {
                                                  break
                                              }

                                              destination
                                                  .write(
                                                      buffer,
                                                      0,
                                                      count
                                                  )

                                              downloaded +=
                                                  count

                                              val percent =
                                                  if (
                                                      totalBytes >
                                                      0
                                                  ) {

                                                      (
                                                          downloaded *
                                                          100 /
                                                          totalBytes
                                                      )
                                                          .toInt()
                                                          .coerceIn(
                                                              0,
                                                              100
                                                          )

                                                  } else {
                                                      -1
                                                  }

                                              if (
                                                  percent !=
                                                  lastPercent
                                              ) {

                                                  lastPercent =
                                                      percent

                                                  val downloadedMb =
                                                      downloaded /
                                                      1024 /
                                                      1024

                                                  val totalMb =
                                                      if (
                                                          totalBytes >
                                                          0
                                                      ) {

                                                          totalBytes /
                                                          1024 /
                                                          1024

                                                      } else {
                                                          0
                                                      }

                                                  runOnUiThread {

                                                      status.text =
                                                          if (
                                                              percent >=
                                                              0
                                                          ) {

                                                              "DOWNLOADING • " +
                                                                  percent +
                                                                  "% • " +
                                                                  downloadedMb +
                                                                  " / " +
                                                                  totalMb +
                                                                  " MB"

                                                          } else {

                                                              "DOWNLOADING • " +
                                                                  downloadedMb +
                                                                  " MB"
                                                          }
                                                  }
                                              }
                                          }

                                          destination
                                              .flush()
                                      }
                              }

                          connection!!
                              .disconnect()

                          connection =
                              null

                          val downloadedSize =
                              temporary.length()

                          if (
                              downloadedSize <
                              50L *
                              1024 *
                              1024
                          ) {

                              temporary.delete()

                              throw Exception(
                                  "Downloaded file is incomplete (" +
                                      (
                                          downloadedSize /
                                          1024 /
                                          1024
                                      ) +
                                      " MB)."
                              )
                          }

                          val header =
                              ByteArray(4)

                          temporary
                              .inputStream()
                              .use { stream ->

                                  if (
                                      stream.read(
                                          header
                                      ) != 4
                                  ) {

                                      throw Exception(
                                          "Could not verify downloaded model."
                                      )
                                  }
                              }

                          val gguf =
                              header[0]
                                  .toInt()
                                  .toChar() ==
                                  'G' &&
                              header[1]
                                  .toInt()
                                  .toChar() ==
                                  'G' &&
                              header[2]
                                  .toInt()
                                  .toChar() ==
                                  'U' &&
                              header[3]
                                  .toInt()
                                  .toChar() ==
                                  'F'

                          if (
                              !gguf
                          ) {

                              temporary.delete()

                              throw Exception(
                                  "Downloaded file is not a valid GGUF model."
                              )
                          }

                          if (
                              modelFile.exists()
                          ) {
                              modelFile.delete()
                          }

                          if (
                              !temporary
                                  .renameTo(
                                      modelFile
                                  )
                          ) {

                              temporary
                                  .copyTo(
                                      modelFile,
                                      overwrite =
                                          true
                                  )

                              temporary
                                  .delete()
                          }

                          if (
                              !modelFile.exists()
                          ) {

                              throw Exception(
                                  "Model could not be saved on the phone."
                              )
                          }

                          val finalMb =
                              modelFile.length() /
                              1024 /
                              1024

                          runOnUiThread {

                              status.text =
                                  "MODEL DOWNLOADED • " +
                                      finalMb +
                                      " MB"

                              addMessage(
                                  "JARVIS",
                                  "Local AI model downloaded and verified successfully. Loading it now."
                              )

                              loadModel()
                          }

                      } catch (
                          error: Exception
                      ) {

                          try {

                              connection
                                  ?.disconnect()

                          } catch (
                              ignored: Exception
                          ) {
                          }

                          runOnUiThread {

                              status.text =
                                  "MODEL DOWNLOAD FAILED"

                              addMessage(
                                  "JARVIS",
                                  "Model download failed: " +
                                      (
                                          error.message
                                              ?: error
                                                  .javaClass
                                                  .simpleName
                                      ) +
                                      ". Tap MODEL to retry."
                              )
                          }
                      }
                  }
              }

'''

          s = (
              s[:start] +
              new_function +
              s[end:]
          )

          p.write_text(s)

          print(
              "Improved Jarvis model downloader installed."
          )
          PY

      - name: Check generated Jarvis source
        shell: bash
        run: |
          test -f app/src/main/java/com/novajarvis/android/MainActivity.kt
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

          echo "Jarvis source restored and downloader upgraded."

      - name: Build Jarvis V2 APK
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify Jarvis V2 APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "Jarvis V2 APK was not created."
            exit 1
          fi

          echo "Jarvis V2 APK created:"
          ls -lh "$APK"

      - name: Upload Jarvis V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
